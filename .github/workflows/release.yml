name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build standalone & create release
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trpg
          POSTGRES_PASSWORD: trpg_ci
          POSTGRES_DB: simple_trpg_chat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Ensure release is from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases must be triggered from main (got $GITHUB_REF)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Configure DB
        run: |
          echo '{"type":"postgresql","url":"postgres://trpg:trpg_ci@localhost:5432/simple_trpg_chat"}' > db.config.json
          echo "DATABASE_URL=postgres://trpg:trpg_ci@localhost:5432/simple_trpg_chat" >> $GITHUB_ENV

      - name: Push schema
        run: pnpm db:push:pg
        env:
          DATABASE_URL: postgres://trpg:trpg_ci@localhost:5432/simple_trpg_chat

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package standalone
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          tar -czf simple-trpg-chat.tar.gz -C .next/standalone .

      - name: Checksum
        run: sha256sum simple-trpg-chat.tar.gz > simple-trpg-chat.tar.gz.sha256

      - name: Get timestamp
        id: ts
        run: echo "ts=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          name: Release ${{ steps.ts.outputs.ts }}
          files: |
            simple-trpg-chat.tar.gz
            simple-trpg-chat.tar.gz.sha256
          tag_name: release-${{ steps.ts.outputs.ts }}
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
