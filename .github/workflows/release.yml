name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build standalone & create release
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trpg
          POSTGRES_PASSWORD: trpg_ci
          POSTGRES_DB: simple_trpg_chat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Ensure release is from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases must be triggered from main (got $GITHUB_REF)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The release is named and tagged from package.json, so a repeat release
      # without a version bump fails here instead of quietly shipping two
      # different builds under one tag.
      - name: Resolve version
        id: version
        run: |
          v=$(node -p "require('./package.json').version")
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::package.json version '$v' is not semver x.y.z"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "::error::tag v$v already exists — bump the version before releasing"
            exit 1
          fi
          echo "version=$v" >> $GITHUB_OUTPUT
          echo "Releasing v$v"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Configure DB
        run: |
          echo '{"type":"postgresql","url":"postgres://trpg:trpg_ci@localhost:5432/simple_trpg_chat"}' > db.config.json
          echo "DATABASE_URL=postgres://trpg:trpg_ci@localhost:5432/simple_trpg_chat" >> $GITHUB_ENV

      - name: Push schema
        run: pnpm db:push:pg
        env:
          DATABASE_URL: postgres://trpg:trpg_ci@localhost:5432/simple_trpg_chat

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package standalone
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          tar -czf simple-trpg-chat-v${{ steps.version.outputs.version }}.tar.gz -C .next/standalone .

      - name: Checksum
        run: |
          f=simple-trpg-chat-v${{ steps.version.outputs.version }}.tar.gz
          sha256sum "$f" > "$f.sha256"

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          name: Release v${{ steps.version.outputs.version }}
          files: |
            simple-trpg-chat-v${{ steps.version.outputs.version }}.tar.gz
            simple-trpg-chat-v${{ steps.version.outputs.version }}.tar.gz.sha256
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
