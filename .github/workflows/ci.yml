name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Test & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trpg
          POSTGRES_PASSWORD: trpg_ci
          POSTGRES_DB: simple_trpg_chat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure database
        run: |
          echo '{"type":"postgresql","url":"postgres://trpg:trpg_ci@localhost:5432/simple_trpg_chat"}' > db.config.json
          echo "DATABASE_URL=postgres://trpg:trpg_ci@localhost:5432/simple_trpg_chat" >> $GITHUB_ENV

      - name: Push schema
        run: pnpm db:push:pg
        env:
          DATABASE_URL: postgres://trpg:trpg_ci@localhost:5432/simple_trpg_chat

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
